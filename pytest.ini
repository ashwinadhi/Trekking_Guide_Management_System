[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    p0: Critical priority tests
    p1: High priority tests
    p2: Medium priority tests
    api: API-level tests
    ui: UI-level tests
    e2e: End-to-end tests
    security: Security tests
    smoke: Smoke tests
